name: Check TikTok Live Status

# De planning is verhuisd naar Supabase (pg_cron roept elke minuut de edge
# function tiktok-live aan, die status.json bijwerkt). GitHub voerde de
# planning hier uren te laat uit. Deze workflow blijft als handmatige
# reserve: Actions, Run workflow.
on:
  workflow_dispatch:

jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run check
        run: python3 check.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "status update"
          git push
