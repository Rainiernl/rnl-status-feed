name: Houd Supabase wakker

# Supabase pauzeert gratis projecten na zeven dagen zonder verkeer.
# Deze ping tikt twee keer per week even aan, zodat Planprikker en de
# contactformulieren niet stilvallen.
#
# GitHub zet geplande workflows in een publieke repo uit na zestig dagen
# zonder commit-activiteit. Daarom schrijft deze run zelf een tijdstempel
# weg. Zo houdt de waker zichzelf wakker, ook als er verder niets gebeurt
# in deze repo.

on:
  schedule:
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase aantikken
        env:
          SUPABASE_URL: https://prubetjmnewibgxodjrk.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/pp_get_poll" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"wakker-houden"}')
          echo "Supabase antwoordde met $CODE"
          cat /tmp/out.json
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase reageerde niet zoals verwacht ($CODE)"
            exit 1
          fi

      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Tijdstempel wegschrijven
        run: |
          mkdir -p .waker
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .waker/laatste-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .waker/laatste-ping.txt
          git commit -m "ping: supabase wakker gehouden" || echo "niets gewijzigd"
          git push
